<section class="vehicle-create-page">
  @if (isPageLoading()) {
    <app-page-loading-overlay [title]="loadingTitle()" [description]="loadingDescription()" />
  }

  <app-vehicle-create-header [submitLoading]="submitLoading" />

  <form id="vehicle-create-form" [formGroup]="form" (ngSubmit)="submit()" class="create-layout">
    <div class="form-stack">
      <app-vehicle-identification-form
        [form]="form"
        [vehicleTypeOptions]="vehicleTypeOptions"
        [fuelTypeOptions]="fuelTypeOptions"
        [transmissionOptions]="transmissionOptions"
        [brandsLoading]="brandsLoading"
        [brandsError]="brandsError"
        [brandSearch]="brandSearch"
        [filteredBrands]="filteredBrands"
        [modelsLoading]="modelsLoading"
        [modelsError]="modelsError"
        [modelSearch]="modelSearch"
        [filteredModels]="filteredModels"
        [yearsLoading]="yearsLoading"
        [yearsError]="yearsError"
        [yearSearch]="yearSearch"
        [filteredYears]="filteredYears"
        [fipeInfoLoading]="fipeInfoLoading"
        [fipeInfoError]="fipeInfoError"
        [getYearLabel]="getYearLabel"
        (vehicleTypeChange)="getBrands($event)"
        (brandOpenedChange)="onBrandSelectOpenedChange($event)"
        (brandChange)="onBrandChange($event)"
        (modelOpenedChange)="onModelSelectOpenedChange($event)"
        (modelChange)="onModelChange($event)"
        (yearOpenedChange)="onYearSelectOpenedChange($event)"
        (yearChange)="onYearChange($event)"
      />

      <app-vehicle-auction-form [form]="form" [auctionTypeOptions]="auctionTypeOptions" />

      <app-vehicle-analysis-form [form]="form" [damageTypeOptions]="damageTypeOptions" />

      <app-vehicle-form-actions [submitLoading]="submitLoading" [submitError]="submitError" />
    </div>
  </form>
</section>
