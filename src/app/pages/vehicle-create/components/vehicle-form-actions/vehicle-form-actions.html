<footer class="form-footer-actions">
  @if (submitError) {
    <p class="submit-error">{{ submitError }}</p>
  }

  <a class="secondary-action" routerLink="/veiculos">Cancelar</a>
  <button class="primary-action" type="submit" [disabled]="submitLoading">
    {{ submitLoading ? 'Cadastrando...' : 'Cadastrar veículo' }}
  </button>
</footer>
