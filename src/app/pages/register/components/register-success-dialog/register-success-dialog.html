<section class="success-dialog">
  <div class="success-accent" aria-hidden="true"></div>

  <div class="success-icon" aria-hidden="true">
    <mat-icon>check_circle</mat-icon>
  </div>

  <div class="success-copy">
    <span>Cadastro concluído</span>
    <h2 mat-dialog-title>Conta criada com sucesso</h2>

    <mat-dialog-content>
      <p>Agora é só entrar com seu e-mail e senha para acessar o Lance Certo.</p>
    </mat-dialog-content>
  </div>

  <mat-dialog-actions align="center">
    <button mat-flat-button class="success-action" mat-dialog-close>Ok</button>
  </mat-dialog-actions>
</section>
