<header class="app-header">
  <label class="search-field" aria-label="Buscar">
    <mat-icon aria-hidden="true">search</mat-icon>
    <input type="search" placeholder="Buscar..." />
  </label>

  <div class="header-actions">
    <a class="create-button" routerLink="/veiculos/novo">Cadastrar Veículo</a>

    <button class="icon-button" type="button" aria-label="Notificações">
      <mat-icon aria-hidden="true">notifications_none</mat-icon>
    </button>

    <button class="icon-button" type="button" aria-label="Ajuda">
      <mat-icon aria-hidden="true">help_outline</mat-icon>
    </button>

    <button class="avatar-button" type="button" aria-label="Perfil do usuário">
      <mat-icon aria-hidden="true">person</mat-icon>
    </button>
  </div>
</header>
